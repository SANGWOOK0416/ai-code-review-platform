name: Evaluate Pipeline

# evaluate_semgrep.py / evaluate_hybrid.py는 순수 stdlib로만 동작하며
# data/processed/, data/results/ 에 이미 커밋된 산출물(semgrep 스캔 결과, LLM 예측 등)을
# 읽어서 지표를 계산한다. 즉 이 CI는 "그 산출물을 다시 로드해서 에러 없이
# Precision/Recall/F1을 계산할 수 있는가"를 검증하는 회귀 테스트다.
# (data/raw/ 만 .gitignore 대상 — data/processed/, data/results/는 커밋 대상이어야
#  이 워크플로우가 통과함)

on:
  push:
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: evaluate_semgrep.py 스모크 테스트 (4개 카테고리)
        run: |
          set -e
          for category in sqli xss cmdi pathtraver; do
            echo "=== $category ==="
            python scripts/evaluate_semgrep.py --category "$category"
          done

      - name: 하이브리드 파이프라인 스모크 테스트 (sqli — cascade/or 둘 다 검증)
        run: |
          set -e
          # 두 통합 규칙 모두 검증 (Ablation에서 나란히 비교하므로 둘 다 살아있어야 함)
          python scripts/merge_hybrid.py --category sqli --rule cascade
          python scripts/evaluate_hybrid.py --category sqli
          python scripts/merge_hybrid.py --category sqli --rule or
          python scripts/evaluate_hybrid.py --category sqli

      - name: sqli OR 규칙 회귀 테스트 (커밋된 기준 지표와 일치하는지)
        run: |
          set -e
          python scripts/merge_hybrid.py --category sqli --rule or
          python scripts/evaluate_hybrid.py --category sqli
          python - <<'PY'
          import json, sys
          m = json.load(open("data/results/sqli/hybrid/hybrid_metrics.json", encoding="utf-8"))
          # 실측 LLM(Claude Sonnet 5, 2026-08-05) + OR 규칙에서 고정되어야 하는 값
          # (리팩터링이 판정을 바꾸면 여기서 걸린다. LLM을 재실행해 결과가 달라지면 이 값도 갱신할 것)
          expected = {"tp": 272, "fp": 199, "fn": 0, "tn": 33}
          actual = {k: m[k] for k in expected}
          if actual != expected:
              sys.exit(f"OR 규칙 회귀 실패: 기대 {expected}, 실제 {actual}")
          print(f"OR 규칙 회귀 통과: {actual}")
          PY

      - name: xss/cmdi/pathtraver 하이브리드 회귀 테스트 (cascade 규칙, 커밋된 기준 지표와 일치하는지)
        run: |
          set -e
          for category in xss cmdi pathtraver; do
            python scripts/merge_hybrid.py --category "$category" --rule cascade
            python scripts/evaluate_hybrid.py --category "$category"
          done
          python - <<'PY'
          import json, sys
          # 실측 LLM(Claude Sonnet 5, 2026-08-05) + cascade 규칙(기본값)에서 고정되어야 하는 값
          # (리팩터링이 판정을 바꾸면 여기서 걸린다. LLM을 재실행해 결과가 달라지면 이 값도 갱신할 것)
          expected = {
              "xss": {"tp": 202, "fp": 33, "fn": 44, "tn": 176},
              "cmdi": {"tp": 112, "fp": 67, "fn": 14, "tn": 58},
              "pathtraver": {"tp": 120, "fp": 59, "fn": 13, "tn": 76},
          }
          failed = []
          for category, exp in expected.items():
              m = json.load(open(f"data/results/{category}/hybrid/hybrid_metrics.json", encoding="utf-8"))
              actual = {k: m[k] for k in exp}
              status = "PASS" if actual == exp else "FAIL"
              print(f"[{category}] {status} — 기대 {exp}, 실제 {actual}")
              if actual != exp:
                  failed.append(category)
          if failed:
              sys.exit(f"cascade 회귀 실패: {failed}")
          PY

      - name: 분할/grounding/보정/규칙비교 스크립트 스모크 테스트
        run: |
          set -e
          python scripts/dataset_split.py --category sqli --dry-run
          python scripts/measure_grounding.py --category sqli
          # 보정 측정은 train 분할만 사용 (held-out은 최종 보고용이라 CI에서 열지 않음)
          python scripts/calibrate_confidence.py --category sqli --sweep
          # Ablation 최종 비교표 (held-out) — 산출물이 재현되는지만 확인
          python scripts/compare_rules_heldout.py

      # 위 스텝들은 pip install 없이(stdlib만) 돌아가야 하므로, 의존성 설치는 이 스텝 안에서만 한다.
      - name: 웹훅 자동 테스트 (pytest — 외부 API 전부 mock, API 키 불필요)
        run: |
          set -e
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest -v
