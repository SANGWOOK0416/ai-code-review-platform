name: Evaluate Pipeline

# evaluate_semgrep.py / evaluate_hybrid.py는 순수 stdlib로만 동작하며
# data/processed/, data/results/ 에 이미 커밋된 산출물(semgrep 스캔 결과, LLM 예측 등)을
# 읽어서 지표를 계산한다. 즉 이 CI는 "그 산출물을 다시 로드해서 에러 없이
# Precision/Recall/F1을 계산할 수 있는가"를 검증하는 회귀 테스트다.
# (data/raw/ 만 .gitignore 대상 — data/processed/, data/results/는 커밋 대상이어야
#  이 워크플로우가 통과함)

on:
  push:
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: evaluate_semgrep.py 스모크 테스트 (4개 카테고리)
        run: |
          set -e
          for category in sqli xss cmdi pathtraver; do
            echo "=== $category ==="
            python scripts/evaluate_semgrep.py --category "$category"
          done

      - name: 하이브리드 파이프라인 스모크 테스트 (sqli만 — xss/cmdi/pathtraver 회귀검증은 아직 미포함, CLAUDE.md 참고)
        run: |
          set -e
          # 두 통합 규칙 모두 검증 (Ablation에서 나란히 비교하므로 둘 다 살아있어야 함)
          python scripts/merge_hybrid.py --category sqli --rule cascade
          python scripts/evaluate_hybrid.py --category sqli
          python scripts/merge_hybrid.py --category sqli --rule or
          python scripts/evaluate_hybrid.py --category sqli

      - name: OR 규칙 회귀 테스트 (커밋된 기준 지표와 일치하는지)
        run: |
          set -e
          python scripts/merge_hybrid.py --category sqli --rule or
          python scripts/evaluate_hybrid.py --category sqli
          python - <<'PY'
          import json, sys
          m = json.load(open("data/results/sqli/hybrid/hybrid_metrics.json", encoding="utf-8"))
          # 실측 LLM(Claude Sonnet 5, 2026-08-05) + OR 규칙에서 고정되어야 하는 값
          # (리팩터링이 판정을 바꾸면 여기서 걸린다. LLM을 재실행해 결과가 달라지면 이 값도 갱신할 것)
          expected = {"tp": 272, "fp": 199, "fn": 0, "tn": 33}
          actual = {k: m[k] for k in expected}
          if actual != expected:
              sys.exit(f"OR 규칙 회귀 실패: 기대 {expected}, 실제 {actual}")
          print(f"OR 규칙 회귀 통과: {actual}")
          PY

      - name: 분할/grounding 스크립트 스모크 테스트
        run: |
          set -e
          python scripts/dataset_split.py --category sqli --dry-run
          python scripts/measure_grounding.py --category sqli
